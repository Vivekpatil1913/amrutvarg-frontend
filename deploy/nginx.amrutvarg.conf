# nginx site for https://amrutvarg.mahaamrut.org.in
#   /            → built frontend (dist/), incl. the /admin panel (SPA routes)
#   /api/v1/     → Amrutvarg-backend on :4000
#   /uploads/    → Amrutvarg-backend on :4000 (admin-uploaded media)
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled,
# then run `certbot --nginx -d amrutvarg.mahaamrut.org.in` for HTTPS.

server {
    listen 80;
    server_name amrutvarg.mahaamrut.org.in;

    root /var/www/amrutvarg/dist;
    index index.html;

    client_max_body_size 12m;   # backend MAX_FILE_SIZE_MB=10 + form overhead

    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 7d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
